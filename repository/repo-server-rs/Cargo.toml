[package]
name = "repo-server-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[example]]
name = "basic_client"
path = "examples/basic_client.rs"

[build-dependencies]
prost-build = "0.12"

[dependencies]
clap = { version = "4", features = ["derive"] }
thiserror = "1"
anyhow = "1"
parking_lot = "0.12"
bytes = "1"
chrono = { version = "0.4", default-features = false, features=["clock"] }
# ZeroMQ dependencies
zmq = "0.10"
# Protocol Buffer dependencies
prost = "0.12"
prost-types = "0.12"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
            # UUID generation
            uuid = { version = "1.0", features = ["v4"] }
