syntax = "proto2";

import "sdms.proto";

package SDMS.Auth;

enum Protocol
{
    ID = 2;
}

// ============================================================================
// ----------- Repository Messages (Repo) -------------------------------------
// ============================================================================

// NOTE: The following messages are use by Core and Repo servers only

// Request to delete the raw data of one or more records from repo
// Reply: AckReply on success, NackError on error
message RepoDataDeleteRequest
{
    repeated string record_ids = 1; // Record IDs to delete
    repeated string file_paths = 2; // Corresponding file paths
}

// Request to get the file size of one or more data records from repo
// Reply: RepoDataSizeReply on success, NackError on error
message RepoDataGetSizeRequest
{
    repeated string record_ids = 1; // Record IDs to get size for
    repeated string file_paths = 2; // Corresponding file paths
}

// Reply to hold raw data size of one or more data records
message RepoDataSizeReply
{
    repeated uint64 sizes = 1; // File sizes in bytes
}

// Request to create a data storage path on a repo
// Reply: AckReply on success, NackError on error
message RepoPathCreateRequest
{
    required string path = 1; // Path to raw data storage directory
}

// Request to delete a data storage path on a repo
// Reply: AckReply on success, NackError on error
message RepoPathDeleteRequest
{
    required string path = 1; // Path to raw data storage directory
}

// ============================================================================
// ----------- Generic Reply Messages -----------------------------------------
// ============================================================================

// Acknowledgment reply for successful operations
message AckReply {
    optional string message = 1; // Optional success message
}

// Negative acknowledgment reply for failed operations
message NackReply {
    required ErrorCode err_code = 1;
    required string err_msg = 2;
}
