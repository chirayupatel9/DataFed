syntax = "proto2";

import "sdms.proto";

package SDMS.Anon;

enum Protocol
{
    ID = 1;
}

// ============================================================================
// ----------- Anonymous Messages ----------------------------------------------
// ============================================================================

// Version request that doesn't require authentication
message VersionRequest {
    // No fields needed for simple version request
}

// Version reply
message VersionReply {
    required uint32 release_year = 1;
    required uint32 release_month = 2;
    required uint32 release_day = 3;
    required uint32 release_hour = 4;
    required uint32 release_minute = 5;
    required uint32 api_major = 6;
    required uint32 api_minor = 7;
    required uint32 api_patch = 8;
    required uint32 component_major = 9;
    required uint32 component_minor = 10;
    required uint32 component_patch = 11;
}
