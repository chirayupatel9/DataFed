# DataFed Repository Server Configuration
# This file contains all configurable options for the server

[server]
# Server port (default: 10000)
port = 10000

# Number of worker threads (default: 4)
num_worker_threads = 4

# Core server address (default: tcp://localhost:9998)
core_server = "tcp://localhost:9998"

# Globus collection path (default: /mnt/datafed-repo)
globus_collection_path = "/mnt/datafed-repo"

# Credentials directory (default: /mnt/storage/rust/DataFed/)
cred_dir = "/mnt/storage/rust/DataFed/"

[logging]
# Log level: trace, debug, info, warn, error (default: info)
level = "info"

# Enable console logging (default: true)
console = true

# Enable file logging (default: false)
file = false

# Log file path (used if file = true)
log_file = "/var/log/datafed-repo-server.log"

[zmq]
# ZeroMQ socket timeout in milliseconds (default: 5000)
receive_timeout_ms = 5000

# ZeroMQ poll timeout in milliseconds (default: 10)
poll_timeout_ms = 10

# Enable debug logging for ZeroMQ operations (default: false)
debug = false

[security]
# Enable Curve security for external connections (default: false)
curve_enabled = false

# Public key for Curve security
public_key = "4X1hKiU5pdwdk.s7&=Q2(b1]p!^Nj=Dnk2&7vh@f"

# Private key for Curve security  
private_key = "G1DpacgVoCcRmLYQ6PA8:Q$]/w5SE*Qm?)}L!@Gv"

[performance]
# Maximum message size in bytes (default: 1048576 = 1MB)
max_message_size = 1048576

# Worker thread idle timeout in seconds (default: 300)
worker_idle_timeout = 300

# Enable connection pooling (default: true)
connection_pooling = true

[monitoring]
# Enable metrics collection (default: false)
metrics_enabled = false

# Metrics collection interval in seconds (default: 60)
metrics_interval = 60

# Enable health check endpoint (default: false)
health_check_enabled = false

# Health check port (default: 10001)
health_check_port = 10001
