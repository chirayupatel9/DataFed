# repo.conf — DataFed Repository Server

[core]
# Address of the Core service the repo talks to (scheme://host:port)
server = tcp://localhost:9998
# Core’s public key (used by the repo to authenticate Core)
public_key = 4X1hKiU5pdwdk.s7&=Q2(b1]p!^Nj=Dnk2&7vh@f

[server]
# Repo's listen port for client connections (not the Core port)
port = 10000
# Number of request worker threads
threads = 4
# Request timeout in milliseconds
timeout_ms = 5000

[security]
# Directory where repo server credentials (keys) live or will be created.
# e.g. repo_server.pub / repo_server.priv
cred_dir = /mnt/storage/rust/DataFed/

[logging]
# log level: trace|debug|info|warn|error|critical
level = info
# send logs to stdout/stderr/syslog (0/1)
stdout = 1
stderr = 0
syslog = 0

[paths]
# Optional — your repo data locations if your server uses them
root_dir = /var/lib/datafed/repo/data
staging_dir = /var/lib/datafed/repo/staging
tmp_dir = /var/lib/datafed/repo/tmp
